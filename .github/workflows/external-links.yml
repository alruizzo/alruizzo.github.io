name: External link check (warning only)

# Reports broken EXTERNAL links (DOIs, publishers, profiles) on a schedule. It never gates a
# deploy: failures are usually rate limits or publisher bot-blocking outside our control.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - run: quarto render
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --scheme https --scheme http --accept 200..=299,403,429 _site
          fail: false
