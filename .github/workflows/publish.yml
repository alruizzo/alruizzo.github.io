name: Build and deploy

# Every push and pull request runs the validator tests and a full render. The render itself
# fails on invalid data (pre-render) and on broken internal links, missing alt text or
# listing/data mismatches (post-render). Only pushes to main deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Test the build checks
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render and check the site
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
