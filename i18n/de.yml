      title: "Top-down-Kontrolle bei leichter kognitiver Beeinträchtigung"
      summary: "Frontoparietale funktionelle Konnektivität liegt Störungen der Top-down-Kontrolle bei Patientinnen und Patienten mit leichter kognitiver Beeinträchtigung zugrunde. Erstautorin ist Hannah Klink, die von Adriana betreute Doktorandin; erschienen in JoCN Forum."
