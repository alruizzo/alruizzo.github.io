  publications:
    ruizrizzo-2024-fornix-fractional:
      summary: "Bei 376 älteren Menschen der DELCODE-Kohorte vermittelte die Mikrostruktur der weißen Substanz im Fornix den Zusammenhang zwischen mediterraner Ernährung und verbalem episodischem Gedächtnis vier Jahre später."
    schrenk-2023-impact-online:
      note: "Studienprotokoll"
    ruizrizzo-2022-subjective-cognitive:
      summary: "Mit Ruhezustands- und Diffusions-MRT über drei Jahre sagte subjektiver kognitiver Abbau eine geringere Konnektivität des cingulo-operkulären Netzwerks bei älteren Menschen mit geringerer Neuritendichte im Forceps minor voraus."
    kuchenhoff-2021-visual-processing:
      note: "Geteilte Letztautorschaft"
    penning-2021-alertness-training:
      summary: "Ein Alertness-Training steigerte die visuelle Verarbeitungsgeschwindigkeit bei gesunden älteren Menschen, und die Konnektivität des cingulo-operkulären Netzwerks vor dem Training sagte den individuellen Trainingsgewinn voraus."
      note: "Geteilte Erstautorschaft; SCHUHFRIED-Wissenschaftspreis 2020"
    ruizrizzo-2019-decreased-cingulo:
      summary: "Bei 91 Erwachsenen im Alter von 20 bis 77 Jahren vermittelte eine verringerte Konnektivität innerhalb des cingulo-operkulären Netzwerks, besonders in der linken Insula, den Effekt des Alters auf die visuelle Verarbeitungsgeschwindigkeit."
