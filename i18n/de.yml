  news:
    fit4brain-noddi-preprint:
      title: "Bewegung und Mikrostruktur der weißen Substanz im Alter"
      summary: "Preprint als Erstautorin aus der randomisierten kontrollierten Studie FIT4BRAIN: Nach körperlichem Training zeigte sich bei gesunden älteren Menschen eine höhere, mit NODDI bestimmte Neuritendichte in den Bahnen der weißen Substanz. Noch nicht begutachtet."
