  news:
    fit4brain-noddi-preprint:
      title: "Ejercicio y microestructura de la sustancia blanca en la vejez"
      summary: "Preprint como primera autora del ensayo controlado aleatorizado FIT4BRAIN, que informa una mayor densidad de neuritas derivada de NODDI en los tractos de sustancia blanca tras el ejercicio físico en personas mayores sanas. Aún sin revisión por pares."
    klink-top-down-control:
      title: "Control descendente en el deterioro cognitivo leve"
      summary: "La conectividad funcional frontoparietal subyace a las alteraciones del control descendente (top-down) en pacientes con deterioro cognitivo leve. Primera autora: Hannah Klink, la doctoranda que dirige Adriana; publicado en JoCN Forum."
