  publications:
    ruizrizzo-2024-fornix-fractional:
      summary: "En 376 personas mayores de la cohorte DELCODE, la microestructura de la sustancia blanca del fórnix medió la asociación entre la adherencia a la dieta mediterránea y la memoria episódica verbal cuatro años después."
    schrenk-2023-impact-online:
      note: "Protocolo de estudio"
    ruizrizzo-2022-subjective-cognitive:
      summary: "Con resonancia magnética en reposo y de difusión a lo largo de tres años, el deterioro cognitivo subjetivo predijo una menor conectividad de la red cíngulo-opercular en personas mayores con menor densidad de neuritas en el fórceps menor."
    kuchenhoff-2021-visual-processing:
      note: "Autoría sénior compartida"
    penning-2021-alertness-training:
      summary: "El entrenamiento de la alerta aumentó la velocidad de procesamiento visual en personas mayores sanas, y la conectividad de la red cíngulo-opercular previa al entrenamiento predijo la ganancia de cada persona."
      note: "Primera autoría compartida; Premio Científico SCHUHFRIED 2020"
    ruizrizzo-2019-decreased-cingulo:
      summary: "En 91 adultos de 20 a 77 años, la menor conectividad dentro de la red cíngulo-opercular, en especial en la ínsula izquierda, medió el efecto de la edad sobre la velocidad de procesamiento visual."
