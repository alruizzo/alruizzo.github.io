      title: "Programa Advanced Medical Scientist del IZKF"
      summary: "Financiación del programa Advanced Medical Scientist del Centro Interdisciplinario de Investigación Clínica del Hospital Universitario de Jena, de 2023 a 2026 (150.000 €)."

