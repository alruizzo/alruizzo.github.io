# News: short, dated updates, newest first (the build fails if the order slips).
# The homepage shows the three most recent; news.qmd lists all of them.
#
# Fields
#   id        lowercase-hyphenated, unique
#   date      YYYY-MM-DD, or YYYY-MM when only the month is known
#   category  one of: Publication, Preprint, Talk, Press, Media, Event, Funding, Project
#   title     short headline (at most 80 characters)
#   summary   one or two sentences (at most 300 characters)
#   url       optional external (https://) or internal (page.qmd#anchor) link for the headline
#   related   optional publication id from publications.yml; the url must then be its DOI link
#
# Sources: publications.yml (dates from ORCID/Crossref) and the October 2026 CV.
